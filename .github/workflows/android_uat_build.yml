name: Android UAT Build

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run Unit Tests? (Manual Run Only)"
        required: true
        type: boolean
        default: false
      environment:
        description: "Environment to build"
        required: true
        type: choice
        options:
          - uat
          - production
        default: uat

  push:
    branches:
      - uat

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Code
        run: dart run build_runner build -d

      - name: Run Unit Tests
        if: ${{ github.event.inputs.run_tests == 'true' }}
        run: flutter test

      - name: Create Env File
        run: |
          touch .env
          echo "API_URL=${{ secrets.API_URL }}" >> .env
          echo "APP_NAME=${{ secrets.APP_NAME }}" >> .env
          echo "FIREBASE_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env
          echo "ENV=${{ github.event.inputs.environment || 'uat' }}" >> .env

      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi --dart-define-from-file=.env

      - name: Send APK to Telegram Group
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 **New UAT Build Ready!**
            ---------------------------
            📌 **Environment:** ${{ github.event.inputs.environment || 'uat' }}
            🔢 **Build Number:** #${{ github.run_number }}
            🌿 **Branch:** ${{ github.ref_name }}
            👤 **Triggered by:** ${{ github.actor }}

            ✅ Testing are skipped (per setup).
          document: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.environment || 'uat' }}-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
