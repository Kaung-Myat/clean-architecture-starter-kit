name: clean_frame_starter
description: "A production-ready Flutter template built with Clean Architecture and Riverpod dependency injection."
publish_to: "none"

version: 2.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  equatable: ^2.0.8
  riverpod_annotation: ^4.0.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  dio: ^5.9.2
  go_router: ^17.3.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  logger: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  build_runner: ^2.14.1
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.13.0

flutter:
  uses-material-design: true
